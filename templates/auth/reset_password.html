<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Nexa</title>
    <style>
        body { margin: 0; padding: 30px 15px; font-family: Arial, sans-serif; background: #f5f2fa; }
        .container { max-width: 450px; margin: 50px auto; padding: 35px; background: white; border-radius: 15px; box-shadow: 0 8px 30px #00000012; }
        h1 { text-align: center; color: #642da0; }
        p { color: #666; line-height: 1.5; }
        label { display: block; margin: 18px 0 7px; font-weight: bold; }
        input { width: 100%; padding: 13px; border: 1px solid #ddd; border-radius: 7px; box-sizing: border-box; }
        button { width: 100%; padding: 14px; margin-top: 25px; background: #642da0; color: white; border: none; border-radius: 7px; cursor: pointer; font-weight: bold; }
        .message { padding: 12px; margin: 10px 0; background: #f1eafa; border-radius: 6px; }
    </style>
</head>
<body>
<div class="container">
    <h1>Choose a New Password</h1>
    <p>Your new password must contain at least 8 characters.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="message">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST">
        <label for="password">New Password</label>
        <input id="password" type="password" name="password" minlength="8" required>

        <label for="confirm_password">Confirm New Password</label>
        <input id="confirm_password" type="password" name="confirm_password" minlength="8" required>

        <button type="submit">Change Password</button>
    </form>
</div>
</body>
</html>
